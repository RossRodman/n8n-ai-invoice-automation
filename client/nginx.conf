# Rendered by the nginx image at startup: ${N8N_UPSTREAM} comes from the env.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The workflow API: /api/<path> is n8n's /webhook/<path>.
    location /api/ {
        proxy_pass ${N8N_UPSTREAM}/webhook/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Extraction calls OpenAI; give it time.
        proxy_read_timeout 120s;
        # Uploaded invoice PDFs.
        client_max_body_size 10m;
    }

    # n8n liveness, for the status pill.
    location = /healthz {
        proxy_pass ${N8N_UPSTREAM}/healthz;
    }

    # Hashed build assets never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths get index.html, and the router takes over.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
